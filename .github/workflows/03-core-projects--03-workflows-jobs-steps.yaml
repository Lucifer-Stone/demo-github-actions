name: Workflows, Jobs and Steps

on:
  workflow_dispatch:

env:
  RELEASE_VERSION: v2.1

jobs:
  job-1:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Job-1 has been executed successfully."

  job-2:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Job-2 has been executed successfully."

  job-3:
    runs-on: ubuntu-24.04
    needs:
      - job-1
      - job-2
    steps:
      - run: echo "Depending on Jobs :- Job-1 & Job-2"
      - run: echo "Job-3 has been executed successfully."

  job-4:
    runs-on: ubuntu-24.04
    needs:
      - job-1
      - job-2
    steps:
      - run: echo "Depending on Jobs :- Job-1 & Job-2"
      - run: echo "Job-4 has been executed successfully."
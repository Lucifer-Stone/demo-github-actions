name: Runner Types

on:
  workflow_dispatch:

jobs:
  github-hosted-linux-runner:
    name: Ubuntu 24.04 VM
    runs-on: ubuntu-24.04
    steps:
      - name: Show Runner Info
        run: |
          echo "Hello from ${{ runner.os }}-${{ runner.arch }}"
          echo "Runner Name (type): ${{ runner.name }}"

  github-hosted-windows-runner:
    name: Windows 2022 VM
    runs-on: windows-2022
    steps:
      - name: Show Runner Info
        shell: pwsh
        run: |
          echo "Hello from ${{ runner.os }}-${{ runner.arch }}"
          echo "Runner Name (type): ${{ runner.name }}"

  github-hosted-mac-runner:
    name: MacOS 14 VM
    runs-on: macos-14
    steps:
      - name: Show Runner Info
        run: |
          echo "Hello from ${{ runner.os }}-${{ runner.arch }}"
          echo "Runner Name (type): ${{ runner.name }}"

  github-hosted-alpine-container:
    name: Alpine Container on Linux Ubuntu VM
    runs-on: ubuntu-24.04
    container:
      image: alpine:3.20
    steps: 
      - name: Show Runner Info
        run: |
          echo "Hello from ${{ runner.os }}-${{ runner.arch }}"
          echo "Runner Name (type): ${{ runner.name }}"
          echo "Container Image: $(grep PRETTY_NAME /etc/os-release)"